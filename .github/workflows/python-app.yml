# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  ODA_ONTOLOGY_PATH: tests/oda-ontology.ttl

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    
    steps:
    - uses: actions/checkout@v2
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.9.9"
        python-version: ${{ matrix.python-version }}

    - name: Install the project
      run: |
        uv sync --locked --all-extras --dev
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "failed lint"
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || echo "failed second lint"
    - name: PyLint - more lint
      run: |
        uv run pylint -E dispatcher_plugin_nb2workflow || echo 'this is fine!'
    - name: MyPy
      run: |
        uv run mypy dispatcher_plugin_nb2workflow --ignore-missing-imports || echo 'this is fine too!'
    - name: Test with pytest
      run: |
        curl -o $ODA_ONTOLOGY_PATH https://raw.githubusercontent.com/oda-hub/ontology/ecdf2a61f87aac13ae7a96c0f3dad960312adae4/ontology.ttl
        uv run python -m coverage run --source=dispatcher_plugin_nb2workflow -m pytest tests -m "not fullstack" -sv --full-trace --log-cli-level=DEBUG 
    - name: Test full stack
      run: |
        uv run python -m coverage run --source=dispatcher_plugin_nb2workflow -m pytest tests -m "fullstack" -sv --full-trace --log-cli-level=DEBUG 